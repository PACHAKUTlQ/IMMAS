# Verification/demo config: RandomRouter + multiple requests + token/welfare logging
# - Reuses already-running local vLLM servers (skip_vllm: true)
# - Generates summary.json + figures/ including perf/token/social_welfare

skip_vllm: true
dry_run: false

router:
  name: "randomrouter"
  config_path: "baseline/one_click/router_configs/randomrouter_online.yaml"
  load_model_path: null

llm_candidates_path: "baseline/one_click/llm_candidates/vllm_candidates.json"

request_stream:
  arrival_process: "poisson"
  poisson_qps: 1.0
  max_requests: 200
  max_duration_sec: 600
  datasets:
    - name: "coqa_multiturn"
      type: "jsonl"
      path: "baseline/one_click/data/coqa_validation_multiturn.jsonl"
      weight: 1.0
      history_mode: "user_assistant"
      history_turns: "all"
      metric_mode: "em_f1"

batching:
  max_batch_size: 4
  time_window_ms: 500
  flush_policy: "size_then_time"

execution:
  timeout_sec: 60
  max_tokens: 256
  temperature: 0.2

# Social welfare definition (chosen calls only):
#   welfare_i = task_performance_i - token_cost_weight * token_cost_i
social_welfare:
  token_cost_weight: 1.0
  token_cost_field: "total_tokens"

shadow_compare:
  enabled: false
  max_candidates_per_request: "all"

output:
  run_dir: null
  write_requests_jsonl: true
  write_model_calls_jsonl: true
  write_routing_decisions_jsonl: true
  write_metrics_csv: true
  write_summary_json: true
  write_figures: true
