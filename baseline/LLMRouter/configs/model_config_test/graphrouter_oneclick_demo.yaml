# GraphRouter inference config (one_click vLLM demo)

data_path:
  query_data_train: 'data/example_data/query_data/default_query_train.jsonl'
  query_data_test: 'data/example_data/query_data/default_query_test.jsonl'
  query_embedding_data: 'data/example_data/routing_data/query_embeddings_longformer.pt'

  routing_data_train: 'data/generated/graphrouter_oneclick_demo/routing_train.jsonl'
  routing_data_test: 'data/generated/graphrouter_oneclick_demo/routing_test.jsonl'

  # Optional (used by GraphRouter.route_batch, not needed for one_click routing)
  llm_data: 'data/generated/graphrouter_oneclick_demo/llm_candidates.json'
  llm_embedding_data: 'data/example_data/llm_candidates/default_llm_embeddings.json'

model_path:
  load_model_path: 'saved_models/graphrouter/graphrouter_oneclick_demo.pt'

metric:
  weights:
    performance: 1
    cost: 0
    llm_judge: 0

hparam:
  hidden_dim: 64

  # The following fields are required for model initialization (even in inference)
  learning_rate: 0.001
  weight_decay: 0.0001
  train_epoch: 5
  batch_size: 4
  train_mask_rate: 0.3
  val_split_ratio: 0.2

  random_state: 42
