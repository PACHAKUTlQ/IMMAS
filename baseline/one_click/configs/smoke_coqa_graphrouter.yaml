# Smoke test config: CoQA multiturn JSONL + GraphRouter (trained checkpoint) + vLLM candidates
# This config assumes vLLM servers are already running on ports 8012/8013.

skip_vllm: true
dry_run: false

router:
  name: "graphrouter"
  # Load GraphRouter from LLMRouter configs; paths inside are relative to baseline/LLMRouter
  config_path: "baseline/LLMRouter/configs/model_config_test/graphrouter_oneclick_demo.yaml"
  # This overrides model_path.load_model_path inside the router config
  load_model_path: "baseline/LLMRouter/llmrouter/saved_models/graphrouter/graphrouter_oneclick_demo.pt"

llm_candidates_path: "baseline/one_click/llm_candidates/vllm_candidates.json"

request_stream:
  arrival_process: "poisson"
  poisson_qps: 0.5
  max_requests: 10
  max_duration_sec: 300
  datasets:
    - name: "coqa_multiturn"
      type: "jsonl"
      path: "baseline/one_click/data/coqa_validation_multiturn.jsonl"
      weight: 1.0
      history_mode: "user_assistant"
      history_turns: "all"
      metric_mode: "em_f1"

batching:
  max_batch_size: 4
  time_window_ms: 500
  flush_policy: "size_then_time"

execution:
  timeout_sec: 60
  max_tokens: 256
  temperature: 0.2

shadow_compare:
  enabled: false
  max_candidates_per_request: "all"

output:
  run_dir: null
  write_requests_jsonl: true
  write_model_calls_jsonl: true
  write_routing_decisions_jsonl: true
  write_metrics_csv: true
  write_summary_json: true
  write_figures: true
