[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "icemas"
version = "0.1.0"
description = "Cache-aware LLM Agent Scheduler MAS with FastAPI and LangGraph"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "langgraph>=0.2.19",
    "langchain>=0.2.14",
    "langchain-core>=0.2.34",
    "langchain-openai>=0.1.22",
    "pydantic>=2.9.0",
    "typing-extensions>=4.12.2",
    "pandas>=2.3.3",
    "matplotlib>=3.10.7",
    "numpy>=2.2.6",
    "datasets>=4.4.1",
    "river>=0.23.0",
    "vllm>=0.12.0",
]

[tool.uv]
[dependency-groups]
dev = [
    "ruff>=0.14.8",
    "ty>=0.0.1a33",
]

[tool.hatch.build.targets.wheel]
packages = ["icemas"]
