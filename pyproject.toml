[project]
name = "IMMAS"
version = "0.1.0"
description = "Incentive Matching Mechanism for Efficient Web LLM Multi-Agent Services Routing"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "datasets>=4.5.0",
  "fastapi>=0.128.0",
  "httpx>=0.28.0",
  "matplotlib>=3.10.8",
  "networkx>=3.6.1",
  "numpy>=2.2.0",
  "openai>=2.15.0",
  "river>=0.23.0",
  "tqdm>=4.67.0",
  "uvicorn[standard]>=0.40.0",
]

[tool.uv]
[dependency-groups]
lint = ["ruff>=0.14.8"]

typing = ["ty>=0.0.12"]

dev = [{ include-group = "lint" }, { include-group = "typing" }, "prek>=0.2.0"]
